
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10152b">
<title>تحدي الكلمات</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:system-ui,Tahoma,Arial;
 background:linear-gradient(145deg,#10152b,#202d50);
 color:#fff;min-height:100vh;padding:20px;
}
.container{max-width:650px;margin:auto}
header{text-align:center;padding:25px 10px}
.logo{font-size:48px}
h1{font-size:32px;margin:8px 0}
.subtitle{color:#aebbd8}
.stats{display:flex;gap:12px;margin:15px 0}
.stat{
 flex:1;background:#ffffff12;border:1px solid #ffffff20;
 padding:14px;border-radius:16px;text-align:center
}
.stat strong{display:block;font-size:23px;color:#7ee7d1}
.panel{
 background:#ffffff12;border:1px solid #ffffff20;
 border-radius:24px;padding:22px;margin-top:18px;
 box-shadow:0 15px 40px #0003
}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{
 border:1px solid #ffffff25;background:#ffffff10;
 color:white;padding:18px 8px;border-radius:18px;
 font-size:16px;cursor:pointer;transition:.2s
}
.mode:active,.mode:hover{background:#ffffff25;transform:scale(.98)}
.mode span{display:block;font-size:30px;margin-bottom:8px}
button{font-family:inherit}
.primary{
 width:100%;border:0;border-radius:15px;padding:15px;
 background:linear-gradient(90deg,#26c6a5,#48a8ee);
 color:#071b2b;font-size:17px;font-weight:bold;cursor:pointer
}
.question{text-align:center;font-size:23px;line-height:1.7;margin:20px 0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{
 padding:15px 8px;border-radius:14px;border:1px solid #ffffff30;
 background:#ffffff12;color:white;font-size:17px;cursor:pointer
}
.choice:disabled{cursor:default;opacity:1}
.correct{background:#168c69!important;border-color:#50e0b5!important}
.wrong{background:#a83b54!important;border-color:#ff8198!important}
.feedback{text-align:center;min-height:35px;margin:15px 0;font-weight:bold}
.hidden{display:none!important}
.back{
 background:transparent;color:#b8c9e9;border:0;
 padding:8px 0;cursor:pointer;font-size:15px
}
.progress{height:8px;background:#ffffff20;border-radius:20px;overflow:hidden}
.progress div{height:100%;background:#55dfbd;width:0;transition:.3s}
.emoji{font-size:75px;text-align:center;margin:20px}
.word{letter-spacing:8px;font-size:30px;text-align:center;margin:25px}
.footer{text-align:center;color:#8291b3;font-size:12px;margin:25px}
@media(max-width:400px){
 body{padding:12px}.panel{padding:16px}
 .question{font-size:20px}.choice{font-size:15px}
}
</style>
</head>
<body>
<div class="container">
<header>
 <div class="logo">🧩</div>
 <h1>تحدي الكلمات</h1>
 <div class="subtitle">اختبر ذكاءك وسرعة تفكيرك!</div>
</header>

<div class="stats">
 <div class="stat">النقاط<strong id="score">0</strong></div>
 <div class="stat">المرحلة<strong id="level">1</strong></div>
 <div class="stat">أفضل نتيجة<strong id="best">0</strong></div>
</div>

<section id="home" class="panel">
 <h2>اختر نمط اللعب</h2>
 <div class="modes">
  <button class="mode" onclick="startGame('word')"><span>🔤</span>تكوين كلمة</button>
  <button class="mode" onclick="startGame('picture')"><span>🖼️</span>خمن الصورة</button>
  <button class="mode" onclick="startGame('link')"><span>🔗</span>الرابط المشترك</button>
  <button class="mode" onclick="startGame('riddle')"><span>🧠</span>لغز ذكي</button>
 </div>
</section>

<section id="game" class="panel hidden">
 <button class="back" onclick="goHome()">← القائمة الرئيسية</button>
 <div class="progress"><div id="progress"></div></div>
 <div id="modeName" class="subtitle" style="text-align:center;margin-top:15px"></div>
 <div id="question" class="question"></div>
 <div id="emoji" class="emoji hidden"></div>
 <div id="choices" class="choices"></div>
 <div id="feedback" class="feedback"></div>
 <button id="next" class="primary hidden" onclick="nextQuestion()">السؤال التالي ←</button>
</section>

<section id="end" class="panel hidden" style="text-align:center">
 <div style="font-size:60px">🏆</div>
 <h2>انتهت الجولة!</h2>
 <p>نتيجتك</p>
 <h1 id="finalScore" style="color:#7ee7d1"></h1>
 <button class="primary" onclick="goHome()">العب مرة أخرى</button>
</section>
<div class="footer">تحدي الكلمات • فكّر، اكتشف، واستمتع</div>
</div>

<script>
const data={
 word:[
  {q:"رتّب الحروف لتكوين اسم حيوان",e:"ب ق ر",a:"بقر",c:["بقر","قرب","برق","قرب"]},
  {q:"رتّب الحروف لتكوين شيء نستخدمه للكتابة",e:"م ل ق",a:"قلم",c:["قلم","ملق","قلمون","قمل"]},
  {q:"رتّب الحروف لتكوين فاكهة",e:"ح ف ت ا",a:"تفاح",c:["تفاح","حافة","فاتح","حوت"]},
  {q:"رتّب الحروف لتكوين شيء في السماء",e:"م ج ن",a:"نجم",c:["نجم","منج","جمن","نمج"]},
  {q:"رتّب الحروف لتكوين وسيلة نقل",e:"ر ق ط ا",a:"قطار",c:["قطار","طريق","قراط","طارق"]},
  {q:"رتّب الحروف لتكوين شيء نقرأه",e:"ك ت ا ب",a:"كتاب",c:["كتاب","كاتب","كبات","تابك"]}
 ],
 picture:[
  {q:"ما هذا الشيء؟",e:"🦁",a:"أسد",c:["أسد","نمر","ذئب","حصان"]},
  {q:"ما هذه الفاكهة؟",e:"🍉",a:"بطيخ",c:["تفاح","بطيخ","عنب","برتقال"]},
  {q:"ما هذا؟",e:"🚀",a:"صاروخ",c:["طائرة","صاروخ","سيارة","قطار"]},
  {q:"ما هذا الحيوان؟",e:"🐬",a:"دلفين",c:["سمكة","دلفين","قرش","حوت"]},
  {q:"ما هذا الشيء؟",e:"🎸",a:"جيتار",c:["كمان","عود","جيتار","بيانو"]},
  {q:"ما هذا؟",e:"🌵",a:"صبار",c:["شجرة","صبار","زهرة","عشب"]}
 ],
 link:[
  {q:"ما الرابط المشترك بين: تفاح، موز، برتقال؟",a:"فواكه",c:["خضروات","فواكه","حيوانات","أدوات"]},
  {q:"ما الرابط المشترك بين: قطة، أسد، نمر؟",a:"حيوانات",c:["طيور","حيوانات","حشرات","أسماك"]},
  {q:"ما الرابط المشترك بين: قلم، ممحاة، مسطرة؟",a:"أدوات مدرسية",c:["ألعاب","أدوات مطبخ","أدوات مدرسية","ملابس"]},
  {q:"ما الرابط المشترك بين: شتاء، ربيع، صيف؟",a:"فصول السنة",c:["أيام الأسبوع","فصول السنة","أشهر السنة","كواكب"]},
  {q:"ما الرابط المشترك بين: أحمر، أزرق، أخضر؟",a:"ألوان",c:["أشكال","ألوان","أرقام","حروف"]},
  {q:"ما الرابط المشترك بين: مكة، الرياض، جدة؟",a:"مدن",c:["أنهار","جبال","مدن","قارات"]}
 ],
 riddle:[
  {q:"شيء له أسنان ولا يعض، ما هو؟",a:"المشط",c:["المشط","الكرسي","الباب","القلم"]},
  {q:"ما الشيء الذي كلما أخذت منه كبر؟",a:"الحفرة",c:["البحر","الحفرة","الجبل","الكتاب"]},
  {q:"ما الشيء الذي يكتب ولا يقرأ؟",a:"القلم",c:["الكتاب","القلم","الطالب","الهاتف"]},
  {q:"له عين واحدة ولا يرى، ما هو؟",a:"الإبرة",c:["الإبرة","الإنسان","السمكة","الكاميرا"]},
  {q:"ما الشيء الذي يسمع بلا أذن ويتكلم بلا لسان؟",a:"الهاتف",c:["الكتاب","الهاتف","الساعة","المفتاح"]},
  {q:"ما الشيء الذي يمشي بلا أرجل؟",a:"الوقت",c:["الوقت","الطفل","الحصان","الطائر"]}
 ]
};

const names={word:"🔤 تكوين كلمة",picture:"🖼️ خمن الصورة",link:"🔗 الرابط المشترك",riddle:"🧠 لغز ذكي"};
let mode="",questions=[],index=0,score=0,locked=false;
let best=Number(localStorage.getItem("wordBest")||0);
document.getElementById("best").textContent=best;

function shuffle(arr){
 let a=[...arr];
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}
function startGame(m){
 mode=m;questions=shuffle(data[m]);index=0;score=0;
 document.getElementById("score").textContent=0;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("end").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 showQuestion();
}
function showQuestion(){
 locked=false;
 const item=questions[index];
 document.getElementById("level").textContent=index+1;
 document.getElementById("modeName").textContent=names[mode];
 document.getElementById("question").textContent=item.q;
 document.getElementById("feedback").textContent="";
 document.getElementById("next").classList.add("hidden");
 document.getElementById("progress").style.width=(index/questions.length*100)+"%";

 const emoji=document.getElementById("emoji");
 if(item.e){emoji.textContent=item.e;emoji.classList.remove("hidden")}
 else{emoji.classList.add("hidden")}

 const choices=document.getElementById("choices");
 choices.innerHTML="";
 shuffle(item.c).forEach(answer=>{
  const b=document.createElement("button");
  b.className="choice";b.textContent=answer;
  b.onclick=()=>choose(b,answer,item.a);
  choices.appendChild(b);
 });
}
function choose(button,answer,correct){
 if(locked)return;
 locked=true;
 const buttons=[...document.querySelectorAll(".choice")];
 buttons.forEach(b=>{
  b.disabled=true;
  if(b.textContent===correct)b.classList.add("correct");
 });
 if(answer===correct){
  score+=10;
  document.getElementById("score").textContent=score;
  document.getElementById("feedback").textContent="إجابة صحيحة! +10 نقاط";
  document.getElementById("feedback").style.color="#65e8bd";
 }else{
  button.classList.add("wrong");
  document.getElementById("feedback").textContent="إجابة غير صحيحة. الصحيحة: "+correct;
  document.getElementById("feedback").style.color="#ff9aaa";
 }
 document.getElementById("next").textContent=
  index===questions.length-1?"عرض النتيجة":"السؤال التالي ←";
 document.getElementById("next").classList.remove("hidden");
}
function nextQuestion(){
 index++;
 if(index>=questions.length){finish();return}
 showQuestion();
}
function finish(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("end").classList.remove("hidden");
 document.getElementById("finalScore").textContent=score+" نقطة";
 if(score>best){
  best=score;localStorage.setItem("wordBest",best);
  document.getElementById("best").textContent=best;
 }
}
function goHome(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("end").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
 document.getElementById("level").textContent=1;
}
</script>
</body>
</html>
